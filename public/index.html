<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>AI Alarm Suara</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 18px;

      background: #f3f4f6;
      color: #111827;

      font-family:
        Arial,
        Helvetica,
        sans-serif;
    }

    .card {
      width: 100%;
      max-width: 580px;

      padding: 22px;

      border-radius: 18px;
      background: #ffffff;

      box-shadow:
        0 12px 35px
        rgba(0, 0, 0, 0.1);
    }

    h1 {
      margin: 0 0 8px;
    }

    .description {
      color: #6b7280;
      line-height: 1.5;
    }

    #status {
      margin: 18px 0;
      min-height: 62px;
      padding: 14px;

      border-radius: 12px;
      background: #eef2ff;

      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    #status.success {
      color: #166534;
      background: #dcfce7;
    }

    #status.error {
      color: #991b1b;
      background: #fee2e2;
    }

    #status.speaking {
      color: #92400e;
      background: #fef3c7;
    }

    .buttons {
      display: grid;
      gap: 10px;
    }

    button {
      width: 100%;
      padding: 15px;

      border: 0;
      border-radius: 12px;

      font-size: 16px;
      font-weight: 700;

      cursor: pointer;
    }

    #startButton {
      color: #ffffff;
      background: #2563eb;
    }

    #stopButton {
      color: #111827;
      background: #e5e7eb;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #details,
    #transcript {
      margin-top: 14px;

      color: #4b5563;

      font-size: 14px;
      line-height: 1.5;

      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    #transcript {
      min-height: 24px;
    }

    audio {
      display: none;
    }
  </style>
</head>

<body>
  <main class="card">
    <h1>AI Alarm Suara</h1>

    <div class="description">
      Tekan mulai, izinkan mikrofon, lalu biarkan halaman tetap terbuka.
    </div>

    <div id="status">
      Belum terhubung.
    </div>

    <div class="buttons">
      <button id="startButton">
        Mulai Asisten
      </button>

      <button
        id="stopButton"
        disabled
      >
        Hentikan
      </button>
    </div>

    <!-- Audio dari Realtime tidak digunakan untuk berbicara. -->
    <audio
      id="remoteAudio"
      autoplay
      playsinline
    ></audio>

    <div id="details"></div>
    <div id="transcript"></div>
  </main>

  <script>
    "use strict";

    const POLL_MS = 20000;

    const startButton =
      document.getElementById(
        "startButton"
      );

    const stopButton =
      document.getElementById(
        "stopButton"
      );

    const statusBox =
      document.getElementById(
        "status"
      );

    const detailsBox =
      document.getElementById(
        "details"
      );

    const transcriptBox =
      document.getElementById(
        "transcript"
      );

    const remoteAudio =
      document.getElementById(
        "remoteAudio"
      );

    let running = false;
    let starting = false;

    let peerConnection = null;
    let dataChannel = null;
    let localStream = null;

    let pollTimer = null;
    let activeReminder = null;

    /*
     * Audio TTS terpisah.
     */
    let ttsAudio = null;
    let ttsObjectUrl = null;
    let ttsToken = 0;
    let ttsPlaying = false;


    startButton.addEventListener(
      "click",
      startAssistant
    );


    stopButton.addEventListener(
      "click",
      function() {
        stopAssistant({
          preserveStatus: false,
          message:
            "Asisten dihentikan."
        });
      }
    );


    async function startAssistant() {
      if (running || starting) {
        return;
      }

      starting = true;

      startButton.disabled = true;
      stopButton.disabled = true;

      clearPollTimer();
      cancelTts();

      activeReminder = null;

      detailsBox.textContent = "";
      transcriptBox.textContent = "";

      setStatus(
        "Meminta izin mikrofon..."
      );

      try {
        if (
          !navigator.mediaDevices ||
          !navigator.mediaDevices
            .getUserMedia
        ) {
          throw new Error(
            "Browser tidak mendukung akses mikrofon."
          );
        }

        localStream =
          await navigator.mediaDevices
            .getUserMedia({
              audio: {
                echoCancellation: true,
                noiseSuppression: true,
                autoGainControl: true
              }
            });

        setStatus(
          "Mikrofon aktif. Menghubungkan OpenAI..."
        );

        peerConnection =
          new RTCPeerConnection();

        peerConnection.ontrack =
          function(event) {
            /*
             * Realtime tidak diperbolehkan
             * membuat jawaban otomatis.
             *
             * Track tetap dipasang agar koneksi
             * WebRTC lengkap, tetapi volumenya
             * dimatikan.
             */
            if (
              event.streams &&
              event.streams[0]
            ) {
              remoteAudio.srcObject =
                event.streams[0];

              remoteAudio.muted = true;
              remoteAudio.volume = 0;
            }
          };


        peerConnection
          .onconnectionstatechange =
            handleConnectionStateChange;


        peerConnection
          .oniceconnectionstatechange =
            function() {
              if (!peerConnection) {
                return;
              }

              console.log(
                "ICE:",
                peerConnection
                  .iceConnectionState
              );
            };


        localStream
          .getTracks()
          .forEach(function(track) {
            peerConnection.addTrack(
              track,
              localStream
            );
          });


        dataChannel =
          peerConnection
            .createDataChannel(
              "oai-events"
            );

        setupDataChannel();


        const offer =
          await peerConnection
            .createOffer();


        await peerConnection
          .setLocalDescription(
            offer
          );


        await waitForIceGathering(
          peerConnection
        );


        const localDescription =
          peerConnection
            .localDescription;


        if (
          !localDescription ||
          !localDescription.sdp
        ) {
          throw new Error(
            "SDP offer browser tidak tersedia."
          );
        }


        const realtimeResponse =
          await fetch(
            "/api/realtime",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "text/plain; charset=utf-8"
              },

              body:
                localDescription.sdp
            }
          );


        const realtimeBody =
          await realtimeResponse.text();


        if (!realtimeResponse.ok) {
          throw new Error(
            formatServerError(
              realtimeBody
            )
          );
        }


        if (
          !realtimeBody ||
          !realtimeBody
            .trim()
            .startsWith("v=0")
        ) {
          throw new Error(
            "Respons Realtime bukan SDP answer yang valid."
          );
        }


        await peerConnection
          .setRemoteDescription({
            type: "answer",
            sdp: realtimeBody
          });


        setStatus(
          "Koneksi dibuat. Menunggu saluran transkripsi..."
        );

      } catch (error) {
        console.error(
          "Gagal memulai:",
          error
        );

        const message =
          getReadableError(error);

        stopAssistant({
          preserveStatus: true
        });

        setStatus(
          message,
          "error"
        );

      } finally {
        starting = false;

        if (!running) {
          startButton.disabled = false;
        }
      }
    }


    function setupDataChannel() {
      if (!dataChannel) {
        return;
      }


      dataChannel.onopen =
        async function() {
          if (running) {
            return;
          }

          running = true;
          starting = false;

          startButton.disabled = true;
          stopButton.disabled = false;

          detailsBox.textContent =
            "Transkripsi OpenAI terhubung.";

          setStatus(
            "Asisten aktif.",
            "success"
          );

          /*
           * Pembuka dibacakan oleh TTS,
           * bukan oleh Realtime.
           */
          await speakExact(
            "Asisten alarm sudah aktif."
          );

          if (running) {
            pollReminder();
          }
        };


      dataChannel.onmessage =
        function(event) {
          try {
            const message =
              JSON.parse(event.data);

            handleRealtimeEvent(
              message
            );

          } catch (error) {
            console.error(
              "Event Realtime tidak valid:",
              error,
              event.data
            );
          }
        };


      dataChannel.onerror =
        function(error) {
          console.error(
            "DataChannel error:",
            error
          );

          setStatus(
            "Saluran transkripsi mengalami kesalahan.",
            "error"
          );
        };


      dataChannel.onclose =
        function() {
          if (!running) {
            return;
          }

          running = false;

          clearPollTimer();
          cancelTts();

          startButton.disabled = false;
          stopButton.disabled = true;

          setStatus(
            "Saluran transkripsi terputus.",
            "error"
          );
        };
    }


    function handleConnectionStateChange() {
      if (!peerConnection) {
        return;
      }

      const state =
        peerConnection
          .connectionState;

      console.log(
        "Connection state:",
        state
      );

      if (state === "connecting") {
        setStatus(
          "Menghubungkan transkripsi..."
        );
      }

      if (state === "connected") {
        setStatus(
          "Koneksi suara terhubung."
        );
      }

      if (
        state === "failed" ||
        state === "disconnected"
      ) {
        setStatus(
          "Koneksi Realtime terputus.",
          "error"
        );
      }

      if (state === "closed") {
        running = false;
      }
    }


    function handleRealtimeEvent(event) {
      if (!event || !event.type) {
        return;
      }

      console.log(
        "Realtime event:",
        event.type
      );


      /*
       * Hanya proses hasil transkripsi.
       */
      if (
        event.type ===
        "conversation.item.input_audio_transcription.completed"
      ) {
        const transcript =
          String(
            event.transcript || ""
          ).trim();

        if (!transcript) {
          return;
        }

        /*
         * Jangan proses transkripsi saat
         * TTS masih berbicara.
         */
        if (ttsPlaying) {
          console.log(
            "Transkripsi diabaikan karena TTS sedang berbicara:",
            transcript
          );

          return;
        }

        transcriptBox.textContent =
          "Kamu: " +
          transcript;

        if (activeReminder) {
          submitReminderAnswer(
            transcript
          );
        }
      }


      if (
        event.type ===
        "conversation.item.input_audio_transcription.failed"
      ) {
        setStatus(
          "Ucapan tidak berhasil dikenali. Silakan ulangi.",
          "error"
        );
      }


      /*
       * Jika Realtime tetap mencoba menghasilkan
       * audio karena suatu konfigurasi lama,
       * jangan putar audionya.
       */
      if (
        event.type ===
        "response.created"
      ) {
        console.warn(
          "Realtime mencoba membuat respons. Audio tetap dibisukan."
        );
      }


      if (event.type === "error") {
        const message =
          event.error &&
          event.error.message
            ? event.error.message
            : "Terjadi kesalahan Realtime.";

        console.error(
          "Realtime error:",
          event
        );

        setStatus(
          message,
          "error"
        );
      }
    }


    async function pollReminder() {
      if (!running) {
        return;
      }

      clearPollTimer();

      try {
        const response =
          await fetch(
            "/api/reminder?action=next&_=" +
            Date.now(),
            {
              method: "GET",
              cache: "no-store"
            }
          );

        const responseText =
          await response.text();

        if (!response.ok) {
          throw new Error(
            formatServerError(
              responseText
            )
          );
        }

        let data;

        try {
          data =
            JSON.parse(
              responseText
            );

        } catch (error) {
          throw new Error(
            "Endpoint jadwal tidak mengembalikan JSON."
          );
        }

        if (!data.ok) {
          throw new Error(
            data.error ||
            "Gagal membaca jadwal."
          );
        }

        if (
          data.reminder &&
          !activeReminder
        ) {
          activeReminder =
            data.reminder;

          detailsBox.textContent =
            "Alarm aktif: " +
            String(
              activeReminder.name || "-"
            ) +
            " • " +
            String(
              activeReminder.time || "-"
            ) +
            " • tahap " +
            String(
              activeReminder.stage || "-"
            );

          transcriptBox.textContent =
            "AI: " +
            String(
              activeReminder.prompt || ""
            );

          setStatus(
            "Alarm sedang dibacakan.",
            "speaking"
          );

          await speakExact(
            activeReminder.prompt
          );

          if (
            running &&
            activeReminder
          ) {
            setStatus(
              "Silakan jawab melalui mikrofon.",
              "success"
            );
          }

        } else if (!activeReminder) {
          await updateSummary();
        }

      } catch (error) {
        console.error(
          "Polling gagal:",
          error
        );

        setStatus(
          "Jadwal gagal diperiksa: " +
          getReadableError(error),
          "error"
        );
      }

      if (running) {
        pollTimer =
          setTimeout(
            pollReminder,
            POLL_MS
          );
      }
    }


    async function submitReminderAnswer(
      transcript
    ) {
      const reminder =
        activeReminder;

      if (!reminder) {
        return;
      }

      /*
       * Hapus sementara agar jawaban
       * tidak dikirim dua kali.
       */
      activeReminder = null;

      setMicrophoneEnabled(false);

      setStatus(
        "Memproses jawaban..."
      );

      try {
        const response =
          await fetch(
            "/api/reminder",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json; charset=utf-8"
              },

              body: JSON.stringify({
                action: "answer",

                reminderId:
                  reminder.id,

                transcript:
                  transcript
              })
            }
          );

        const responseText =
          await response.text();

        if (!response.ok) {
          throw new Error(
            formatServerError(
              responseText
            )
          );
        }

        let data;

        try {
          data =
            JSON.parse(
              responseText
            );

        } catch (error) {
          throw new Error(
            "Jawaban server bukan JSON yang valid."
          );
        }

        if (!data.ok) {
          throw new Error(
            data.error ||
            "Jawaban gagal disimpan."
          );
        }

        const reply =
          String(
            data.reply ||
            "Jawaban sudah disimpan."
          );

        setStatus(
          reply,
          data.action === "unknown"
            ? ""
            : "success"
        );

        transcriptBox.textContent +=
          "\nAI: " +
          reply;

        await speakExact(
          reply
        );

        await updateSummary();

      } catch (error) {
        console.error(
          "Jawaban gagal:",
          error
        );

        activeReminder =
          reminder;

        setStatus(
          "Jawaban gagal diproses: " +
          getReadableError(error),
          "error"
        );

      } finally {
        if (
          running &&
          !ttsPlaying
        ) {
          setMicrophoneEnabled(true);
        }
      }
    }


    /*
     * Semua suara alarm menggunakan /api/tts.
     * Tidak ada response.create ke Realtime.
     */
    async function speakExact(text) {
      const cleanText =
        String(text || "").trim();

      if (!cleanText) {
        return;
      }

      const currentToken =
        ++ttsToken;

      cleanupTtsAudio();

      ttsPlaying = true;
      setMicrophoneEnabled(false);

      try {
        const response =
          await fetch(
            "/api/tts",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json; charset=utf-8"
              },

              body: JSON.stringify({
                text: cleanText
              })
            }
          );

        if (!response.ok) {
          const errorText =
            await response.text();

          throw new Error(
            formatServerError(
              errorText
            )
          );
        }

        const audioBlob =
          await response.blob();

        /*
         * Ada permintaan TTS lebih baru.
         */
        if (
          currentToken !== ttsToken
        ) {
          return;
        }

        ttsObjectUrl =
          URL.createObjectURL(
            audioBlob
          );

        ttsAudio =
          new Audio(
            ttsObjectUrl
          );

        ttsAudio.preload = "auto";

        await new Promise(
          function(resolve, reject) {
            ttsAudio.onended =
              function() {
                resolve();
              };

            ttsAudio.onerror =
              function() {
                reject(
                  new Error(
                    "Audio TTS gagal diputar."
                  )
                );
              };

            ttsAudio
              .play()
              .catch(reject);
          }
        );

      } catch (error) {
        console.error(
          "TTS gagal:",
          error
        );

        setStatus(
          "Gagal membacakan suara: " +
          getReadableError(error),
          "error"
        );

      } finally {
        if (
          currentToken === ttsToken
        ) {
          cleanupTtsAudio();

          ttsPlaying = false;

          if (running) {
            setMicrophoneEnabled(true);
          }
        }
      }
    }


    function cancelTts() {
      ttsToken++;
      ttsPlaying = false;

      cleanupTtsAudio();

      if (running) {
        setMicrophoneEnabled(true);
      }
    }


    function cleanupTtsAudio() {
      if (ttsAudio) {
        try {
          ttsAudio.pause();
          ttsAudio.currentTime = 0;
        } catch (error) {
          console.warn(error);
        }

        ttsAudio.onended = null;
        ttsAudio.onerror = null;
        ttsAudio = null;
      }

      if (ttsObjectUrl) {
        URL.revokeObjectURL(
          ttsObjectUrl
        );

        ttsObjectUrl = null;
      }
    }


    /*
     * Mikrofon dimatikan sementara saat TTS berbicara.
     * Ini mencegah AI mendengar suara alarmnya sendiri.
     */
    function setMicrophoneEnabled(enabled) {
      if (!localStream) {
        return;
      }

      localStream
        .getAudioTracks()
        .forEach(function(track) {
          track.enabled =
            Boolean(enabled);
        });
    }


    async function updateSummary() {
      try {
        const response =
          await fetch(
            "/api/reminder?action=summary&_=" +
            Date.now(),
            {
              method: "GET",
              cache: "no-store"
            }
          );

        const responseText =
          await response.text();

        if (!response.ok) {
          throw new Error(
            formatServerError(
              responseText
            )
          );
        }

        const data =
          JSON.parse(
            responseText
          );

        if (!data.ok) {
          throw new Error(
            data.error ||
            "Ringkasan gagal dibaca."
          );
        }

        detailsBox.textContent =
          "Status CLOSE: " +
          String(
            data.closeCount ?? "-"
          ) +
          " • Terlambat: " +
          String(
            data.overdueCount ?? "-"
          ) +
          " • Server: " +
          String(
            data.serverTime || "-"
          );

      } catch (error) {
        console.error(
          "Ringkasan gagal:",
          error
        );
      }
    }


    function stopAssistant(options) {
      const settings =
        options || {};

      running = false;
      starting = false;
      activeReminder = null;

      clearPollTimer();
      cancelTts();

      if (dataChannel) {
        try {
          dataChannel.close();
        } catch (error) {
          console.warn(error);
        }

        dataChannel = null;
      }

      if (peerConnection) {
        try {
          peerConnection.close();
        } catch (error) {
          console.warn(error);
        }

        peerConnection = null;
      }

      if (localStream) {
        localStream
          .getTracks()
          .forEach(function(track) {
            track.stop();
          });

        localStream = null;
      }

      remoteAudio.pause();
      remoteAudio.srcObject = null;

      startButton.disabled = false;
      stopButton.disabled = true;

      if (!settings.preserveStatus) {
        setStatus(
          settings.message ||
          "Asisten dihentikan."
        );
      }
    }


    function clearPollTimer() {
      if (pollTimer) {
        clearTimeout(
          pollTimer
        );

        pollTimer = null;
      }
    }


    function waitForIceGathering(pc) {
      if (
        pc.iceGatheringState ===
        "complete"
      ) {
        return Promise.resolve();
      }

      return new Promise(
        function(resolve) {
          let finished = false;

          function finish() {
            if (finished) {
              return;
            }

            finished = true;

            pc.removeEventListener(
              "icegatheringstatechange",
              checkState
            );

            resolve();
          }

          function checkState() {
            if (
              pc.iceGatheringState ===
              "complete"
            ) {
              finish();
            }
          }

          pc.addEventListener(
            "icegatheringstatechange",
            checkState
          );

          /*
           * Jangan menunggu ICE selamanya.
           */
          setTimeout(
            finish,
            5000
          );
        }
      );
    }


    function getReadableError(error) {
      if (!error) {
        return (
          "Terjadi kesalahan yang tidak diketahui."
        );
      }

      if (
        error.name ===
        "NotAllowedError"
      ) {
        return (
          "Izin mikrofon ditolak. " +
          "Izinkan mikrofon melalui pengaturan situs browser."
        );
      }

      if (
        error.name ===
        "NotFoundError"
      ) {
        return (
          "Mikrofon tidak ditemukan."
        );
      }

      if (
        error.name ===
        "NotReadableError"
      ) {
        return (
          "Mikrofon sedang digunakan aplikasi lain."
        );
      }

      if (
        error.name ===
        "AbortError"
      ) {
        return (
          "Proses dibatalkan oleh browser."
        );
      }

      return (
        error.message ||
        String(error)
      );
    }


    function formatServerError(text) {
      const raw =
        String(text || "").trim();

      if (!raw) {
        return (
          "Server tidak memberikan pesan kesalahan."
        );
      }

      try {
        const parsed =
          JSON.parse(raw);

        if (
          parsed.details &&
          typeof parsed.details ===
            "string"
        ) {
          try {
            const details =
              JSON.parse(
                parsed.details
              );

            return (
              details.error &&
              details.error.message
                ? details.error.message
                : parsed.error ||
                  parsed.details
            );

          } catch (error) {
            return (
              parsed.error
                ? parsed.error +
                  ": " +
                  parsed.details
                : parsed.details
            );
          }
        }

        return (
          parsed.error ||
          parsed.message ||
          raw
        );

      } catch (error) {
        return raw;
      }
    }


    function setStatus(text, type) {
      statusBox.textContent =
        String(text || "");

      statusBox.className = "";

      if (type) {
        statusBox.classList.add(
          type
        );
      }
    }


    window.addEventListener(
      "beforeunload",
      function() {
        stopAssistant({
          preserveStatus: true
        });
      }
    );


    document.addEventListener(
      "visibilitychange",
      function() {
        if (
          !document.hidden &&
          running
        ) {
          updateSummary();
        }
      }
    );
  </script>
</body>
</html>
